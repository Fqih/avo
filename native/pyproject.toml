[build-system]
requires = ["maturin>=1.5"]
build-backend = "maturin"

[project]
name = "avo-native"
version = "0.1.4"
description = "Native speedups for the Avo agent runtime."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Fqih", email = "mhmdfkih21@gmail.com" }]
keywords = ["avo", "pyo3", "agents", "performance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[tool.maturin]
# Build a single wheel that loads on any Python >= 3.11 — matches
# the main avo package's `requires-python` floor and avoids shipping
# per-interpreter wheels for this alpha extension.
python-version = "3.11"
module-name = "avo_native"
features = ["pyo3/extension-module"]
