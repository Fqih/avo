[package]
name = "avo-native"
version = "0.1.4"
edition = "2021"
description = "Native speedups for the Avo agent runtime (PyO3)"
license = "MIT"
repository = "https://github.com/Fqih/avo"
publish = false

[lib]
name = "avo_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["abi3-py311"] }
sha2 = "0.10"
hex = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
