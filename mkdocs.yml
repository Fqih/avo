site_name: Avo
site_description: Provider-agnostic reliability runtime for bounded, observable, resumable AI agent loops.
site_url: https://avo.faqihhakim.tech/
repo_url: https://github.com/Fqih/avo
repo_name: Fqih/avo
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

# Internal implementation plans are useful in the repository but should not
# become part of the public product documentation or search index.
exclude_docs: |
  superpowers/**

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Home: index.md
  - Guides:
    - Quickstart: guides/quickstart.md
    - Installation: guides/install.md
    - Subscription OAuth: guides/subscription-auth.md
    - Combo Routing: guides/combo-routing.md
  - Reference:
    - Project reference: avo-reference.md
    - API stability: api-stability.md
    - SemVer policy: semver.md
    - Parity vs CC/Codex: parity-vs-cc-codex.md
    - Changelog: changelog.md
    - CLI: cli.md
    - API reference: api/index.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Fqih/avo
      name: Avo on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/avo/
      name: Avo on PyPI
  generator: false

extra_css:
  - assets/extra.css

copyright: Copyright &copy; 2026 Fqih. Released under MIT.
