# Netlify configuration for the Avo documentation site.
#
# The site is published by Netlify from the `site/` directory produced
# by `mkdocs build`. The build is run by Netlify's CI from the
# `mkdocs build --strict` command below — the `site/` directory is
# only shipped as a fallback artifact from the GitHub Actions docs
# workflow when you want to deploy manually.
#
# To enable drag-and-drop UI deploys, Netlify needs the `publish`
# directory below — drop the artifact from the Actions docs workflow
# into Netlify without these settings and the upload ignores them.

[build]
  command = "python -m pip install -e '.[dev,docs,providers,sandbox,otel,langchain]' && bash scripts/build_site.sh"
  publish = "site/"

[build.environment]
  PYTHON_VERSION = "3.12"
  PIP_DISABLE_PIP_VERSION_CHECK = "1"

# Cache pip + mkdocs-material assets between builds so cold builds
# stay fast.
[[build.cache]]
  paths = [".pip-cache", ".cache"]

# MkDocs Material emits absolute asset URLs that point at the site's
# configured `site_url` (see `mkdocs.yml`). Redirects here keep deep
# links working when the site is mounted under a Netlify subdomain.
[[redirects]]
  from = "/avo/*"
  to = "/:splat"
  status = 301

# MkDocs Material ships some long-path assets (search index,
# sitemap) — keep them cacheable for the full TTL.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/search/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
