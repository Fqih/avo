name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,providers,sandbox,otel,langchain]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy src/avo
      - name: Bandit
        run: bandit -r src/avo -c pyproject.toml --severity-level medium
      - name: pip-audit
        # Audit dependencies only — auditing avo itself against PyPI
        # fails for the unreleased version editable-installed from the
        # repo (the same race release.yml already avoids).
        run: pip-audit --strict --requirement <(python -c "import tomllib; print('\n'.join(tomllib.loads(open('pyproject.toml').read())['project']['dependencies']))")
      - name: Tests
        run: pytest
      - name: Build
        env:
          # Reproducible build: pin build timestamp to the latest
          # commit so wheel and sdist are byte-identical between runs.
          SOURCE_DATE_EPOCH: ${{ format('{0}', github.event.repository.updated_at_timestamp) }}
        run: |
          # GitHub's ``github.event.repository.updated_at_timestamp`` is
          # not always present; fall back to ``git log -1`` so the
          # build is reproducible locally too.
          if [ -z "${SOURCE_DATE_EPOCH:-}" ]; then
            SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          fi
          export SOURCE_DATE_EPOCH
          python -m build

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tooling
        run: python -m pip install -e ".[dev]"
      - name: Build wheel and sdist (reproducible)
        env:
          SOURCE_DATE_EPOCH: ${{ github.event.repository.updated_at_timestamp }}
        run: |
          if [ -z "${SOURCE_DATE_EPOCH:-}" ]; then
            SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          fi
          export SOURCE_DATE_EPOCH
          python -m build
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          format: cyclonedx-json
          artifact: dist/avo-*.whl,dist/avo-*.tar.gz
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: "*spdx.json,*cdx.json,*sbom*"
      - name: Validate SBOM is valid JSON
        run: |
          find . -maxdepth 2 -name '*.cdx.json' -print -exec python -c "import json,sys; json.load(open(sys.argv[1])); print('valid:', sys.argv[1])" {} \;
