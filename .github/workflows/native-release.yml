name: Native release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name to build native wheels for (e.g. v0.1.3)"
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  wheels:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux glibc wheels — cover Fedora, Ubuntu, Debian, Alpine
          # with glibc, plus RHEL and Amazon Linux. Built on ubuntu
          # with the action's zig-powered cross toolchains.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          # macOS — Apple clang cross-compiles x86_64 from the arm64
          # runner, so both legs share macos-latest. GNU cc on the
          # Linux runners does not accept `-arch`, which is what the
          # previous ubuntu-hosted darwin legs failed on.
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          # Windows MSVC — needs the Visual Studio linker; cannot build
          # on Linux. aarch64-pc-windows-msvc is not in the matrix: the
          # ARM64 MSVC toolchain is not reliably present on the runner
          # image, and the abi3 sdist covers that platform.
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          working-directory: native
          sccache: "true"
          rust-toolchain: stable
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: |
            native/dist/*.whl
          if-no-files-found: error

  sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build source distribution
        working-directory: native
        run: |
          python -m pip install "maturin>=1.5"
          maturin sdist --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: native-sdist
          path: native/dist/*.tar.gz
          if-no-files-found: error

  attach:
    name: Attach to GitHub release
    needs: wheels
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: native-dist
      - name: Flatten
        run: |
          mkdir -p native-flat
          find native-dist -type f -name '*.whl' -exec cp {} native-flat/ \;
          ls -la native-flat
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: native-flat/*.whl

  publish:
    name: Publish to PyPI
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    # Same publishing environment as release.yml — trusted publisher
    # for `avo-native` on pypi.org matches (owner Fqih, repo avo,
    # workflow native-release.yml, environment pypi). No token secret.
    environment: pypi
    permissions:
      id-token: write
    steps:
      # upload-artifact@v4 strips common parents, so every leg's wheel
      # and the sdist land flat under ./dist — exactly what the pypa
      # action expects as packages-dir.
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: dist
          merge-multiple: true
      - name: Publish (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
