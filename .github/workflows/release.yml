name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name to publish (e.g. v0.1.3)"
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    name: Build, sign, attest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tooling
        run: python -m pip install -e ".[dev,providers,sandbox,otel,langchain]" && python -m pip install build
      - name: Run quality gates
        run: |
          ruff check .
          ruff format --check .
          mypy src/avo
          pytest
          bandit -r src/avo -c pyproject.toml --severity-level medium
          # Audit dependencies only — auditing avo from PyPI here
          # would race with the version being published.
          # Reading from pyproject.toml guarantees a reproducible list.
          pip-audit --strict --requirement <(python -c "import tomllib; print('\n'.join(tomllib.loads(open('pyproject.toml').read())['project']['dependencies']))")
      - name: Build wheel and sdist (reproducible)
        env:
          SOURCE_DATE_EPOCH: ${{ github.event.repository.updated_at_timestamp || '0' }}
        run: |
          if [ "${SOURCE_DATE_EPOCH}" = "0" ]; then
            SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          fi
          export SOURCE_DATE_EPOCH
          python -m build
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          format: cyclonedx-json
          artifact: dist/avo-*.whl,dist/avo-*.tar.gz
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: "*spdx.json,*cdx.json,*sbom*"
      # Sigstore signing uses the `sigstore` Python client directly
      # instead of `sigstore/gh-action-sigstore-python@v3`. That action
      # ships stale TUF trust-root metadata and fails verification in
      # CI runners. The Python client bundles its own (refreshable)
      # TUF metadata and uses GitHub Actions' OIDC token for keyless
      # signing, satisfying SLSA + Sigstore's PyPI guidance.
      - name: Install Sigstore client
        run: python -m pip install "sigstore>=3.0,<4"
      - name: Sign wheels with Sigstore
        # ``ACTIONS_ID_TOKEN`` is auto-populated by the runner when the
        # workflow has ``id-token: write`` permission (set at the top
        # of this job). ``sigstore.sign`` reads it directly via env.
        run: |
          mkdir -p dist/sigstore
          for wheel in dist/*.whl; do
            echo "signing $wheel"
            python -m sigstore.sign \
              --oidc-provider github \
              --identity-token "${ACTIONS_ID_TOKEN}" \
              --output-directory dist/sigstore \
              "$wheel"
          done
      - name: Upload wheel + sdist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/*.whl
            dist/*.tar.gz
      - name: Attach artifacts to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/sigstore/*
            *sbom*
          generate_release_notes: true
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: dist/avo-*.whl

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Dedicated publishing environment. The name must match the
    # "Environment name" registered as the trusted publisher on
    # pypi.org (owner Fqih, repo avo, workflow release.yml,
    # environment pypi). No PYPI_TOKEN secret: the action
    # authenticates with the job's GitHub OIDC id-token.
    environment: pypi
    permissions:
      id-token: write
    steps:
      # upload-artifact@v4 strips the common `dist/` parent when
      # storing, so the entries are flat wheel/sdist names — extract
      # them into ./dist/ to match the pypa action's default
      # packages-dir.
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
