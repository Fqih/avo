name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "src/avo/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "src/avo/**"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

# Pages is configured with "GitHub Actions" as its source (and a
# custom domain for avo.faqihhakim.tech), so the site must ship through the
# upload-pages-artifact + deploy-pages pattern; branch pushes to
# gh-pages (``mkdocs gh-deploy``) would be ignored.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,docs,providers,sandbox,otel,langchain]"
      - name: Build (strict)
        # ``--strict`` fails on warnings (broken links, missing nav
        # references, malformed admonitions). Keeps docs honest.
        run: mkdocs build --strict
      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: mkdocs-site
          path: site
          retention-days: 7
      - name: Upload Pages artifact
        # The artifact the deploy-pages action consumes; distinct from
        # the retained browsable artifact above.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    # Publish only from main pushes; PRs just verify the strict build.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
