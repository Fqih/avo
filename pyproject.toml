[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "avo"
version = "0.7.3"
description = "Reliable execution infrastructure for long-running AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Fqih", email = "mhmdfkih21@gmail.com" },
]
maintainers = [
  { name = "Fqih", email = "mhmdfkih21@gmail.com" },
]
keywords = [
  "agents",
  "ai",
  "llm",
  "reliability",
  "sqlite",
  "runtime",
  "state-machine",
  "resumable",
  "observable",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.8,<3",
  "prompt-toolkit>=3.0.43",
]

[project.optional-dependencies]
all = [
  # Runtime integrations suitable for a user-global CLI installation.
  "avo-native>=0.1.4",
  "httpx>=0.27",
  "docker>=7.0",
  "mcp>=1.0",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp>=1.27",
  "langchain-core>=0.3",
]
dev = [
  "bandit[toml]>=1.7",
  "build>=1.2",
  "coverage[toml]>=7.6",
  "hatchling>=1.26",
  "keyring>=25.0",
  "mypy>=1.11",
  "pip-audit>=2.7",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
]
docs = [
  # Build the static documentation site (used by the docs CI job
  # and the `mkdocs gh-deploy` publishing step). Optional — install
  # only when you want to preview or regenerate docs locally.
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.25",
  "pymdown-extensions>=10.8",
]
native = [
  # Prebuilt abi3 wheels (cp311+) for Linux/macOS/Windows published
  # from native-release.yml; sdist fallback for other platforms. The
  # pure-Python fallback in ``avo.providers.prompt_cache`` always
  # produces identical cache keys; install this extra only when the
  # native streaming digest is worth an extra dependency.
  "avo-native>=0.1.4",
]
live-benchmark = [
  "httpx>=0.27",
  "matplotlib>=3.8",
]
providers = [
  "httpx>=0.27",
]
keyring = [
  # Optional OS-backed credential storage. The secure 0600 JSON backend
  # remains the dependency-free fallback.
  "keyring>=25.0",
]
security = [
  # Fernet-encrypted file credential backend for headless environments.
  "cryptography>=43",
]
sandbox = [
  "docker>=7.0",
]
mcp = [
  # MCP servers are launched as subprocesses that speak JSON-RPC over stdio.
  # Avo itself does not depend on the upstream `mcp` SDK — it ships a
  # minimal JSON-RPC client. Install this extra only when you want the
  # richer SDK helpers (server authoring, transports beyond stdio).
  "mcp>=1.0",
]
otel = [
  # OpenTelemetry integration. Optional because the avo core stays
  # dependency-light; install only when you want to emit OTLP spans
  # to a collector. Activation requires AVO_OTEL_ENABLED=1.
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp>=1.27",
]
langchain = [
  # LangChain bridge for wrapping avo ModelProvider as BaseChatModel
  # and adapting LangChain StructuredTool instances into avo's
  # FunctionTool registry. Optional — install only when integrating
  # avo with chains, agents, or output parsers.
  "langchain-core>=0.3",
]

[project.scripts]
avo = "avo.cli:main"

[project.urls]
Homepage = "https://github.com/Fqih/avo"
Repository = "https://github.com/Fqih/avo"
Issues = "https://github.com/Fqih/avo/issues"
Changelog = "https://github.com/Fqih/avo/blob/main/CHANGELOG.md"
Documentation = "https://github.com/Fqih/avo#readme"
Funding = "https://github.com/Fqih/avo"

[project.entry-points.pytest11]
avo-live = "avo._pytest_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/avo"]
reproducible = true

[tool.pytest.ini_options]
# Skip the live integration tests by default so the offline suite stays
# free of paid API traffic. Run them with `pytest --run-live tests/integration`.
addopts = "--strict-config --strict-markers --ignore=tests/integration -p no:langsmith_plugin"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "live: opt-in tests that hit real HTTP endpoints; require --run-live",
]
# Async subprocess transports raise "Event loop is closed" during GC in
# 3.12.14 (rare, harmless). Suppress so the suite stays green.
filterwarnings = [
  "ignore::pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
branch = true
source = ["avo"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["tests/fixtures"]
# Markdown formatting requires the ruff preview mode; skip .md files so
# `ruff format --check` is green without opting into experimental rules.
exclude = ["*.md"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
  "SIM",
  "ASYNC",
  "RUF",
]

[tool.ruff.lint.per-file-ignores]
"examples/*.py" = ["T201"]
"benchmark/*.py" = ["T201"]
"src/avo/mcp_servers/*.py" = ["ASYNC109", "ASYNC210"]
"tests/test_mcp_servers.py" = ["ASYNC221"]

[tool.bandit]
# Subprocess calls without ``shell=True`` are intentional — avo never
# invokes a shell to interpret user input. MCP server subprocess
# launches use ``shell=False`` already; the warning is noise.
# ``B105`` is a false positive: ``token_budget_exceeded`` is an error
# tag, not a password.
# ``B311`` flags the random module for crypto use — avo only uses
# random for retry jitter, never for secrets.
# MCP servers have their own security model and are audited in a
# separate pipeline that ships with ``avo[mcp]``.
skips = [
  "B101",  # assert_used (invariants, not validation)
  "B105",  # hardcoded_password_string (error tag, not credential)
  "B108",  # hardcoded_tmp_directory (container/bwrap in-sandbox tmpfs mount target)
  "B112",  # try_except_continue (intentional in retry loops)
  "B311",  # random for non-crypto jitter
  "B404",  # subprocess import
  "B603",  # subprocess_without_shell_equals_true
  "B607",  # start_process_with_partial_path
  "B310",  # urllib_urlopen (MCP http_fetch is sandbox-scoped)
  "B608",  # hardcoded_sql_expressions (MCP sqlite uses parameterised queries)
]
exclude_dirs = ["src/avo/mcp_servers", "tests"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["avo"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# Optional native wheel: absent in most CI environments, untyped when
# present. Treat as Any either way so the lazy loader type-checks in
# every environment.
[[tool.mypy.overrides]]
module = "avo_native"
ignore_missing_imports = true
